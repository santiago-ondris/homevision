name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: api/go.sum
      - name: Install linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: make lint-api
      - run: make test-api GOFLAGS=-race

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            worker/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r worker/requirements.txt -r worker/requirements-dev.txt
      - run: make lint-worker
      - run: make test-worker

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make lint-web
      - run: cd web && npm run build

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: ./scripts/smoke.sh
      - run: docker compose run --rm eval python -m eval.evaluate --set samples --check
      - run: docker compose down
        if: always()
