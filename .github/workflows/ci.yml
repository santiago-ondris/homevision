name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          python -m venv worker/.venv
          source worker/.venv/bin/activate
          python -m pip install -r worker/requirements.txt -r worker/requirements-dev.txt
          cd web && npm ci && cd ..
          cd api && go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Check code
        run: |
          source worker/.venv/bin/activate
          make lint
          make test
          cd web && npm run build
      - name: Check detection baseline
        run: |
          docker compose build eval
          docker compose run --rm eval python -m eval.evaluate --set samples --check
