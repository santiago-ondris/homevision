services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 5s
      timeout: 2s
      retries: 10
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      worker:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "5173:80"
  eval:
    build:
      context: .
      dockerfile: worker/Dockerfile
    profiles: ["tools"]
    volumes:
      - ./samples:/worker/samples:ro
      - ./eval:/worker/eval:ro
    command: ["python", "-m", "eval.evaluate", "--set", "all"]
